<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body> 
  <main class="app">
      <header class="header">
        <div>
          <h1>Weather Dashboard</h1>
        </div>

        <div class="search">
          <input id="city_id" type="text" placeholder="Enter a city" value="Berlin">
          <button id="search_button">Search</button>
        </div>
      </header>

      <p id="status"></p>

      <section class="current-weather card">
        <div>
          <p id="location" class="location">Loading</p>
          <div id="temperature" class="temperature">--°</div>
          <p id="condition">--</p>
        </div>

        <div class="details">
          <div>
            <span>Feels Like</span>
            <strong id="feelsLike">--</strong>
          </div>
        </div>
        <div>
          <span>Humidity</span>
          <strong id="humidity">--%</strong>
        </div>
        <div>
          <span>Wind</span>
          <strong id="wind">-- km/h</strong>
        </div>
        <div>
          <span>Precipitation</span>
          <strong id="precipitation">-- mm</strong>
        </div>
      </div>
      </section>

      <section class="card">
        <h2>Next 24 Hours</h2>
        <div id="hourlyForecast" class="hourly-forecast"></div>
      </section>

      <section class="card">
        <h2>7-Day Forecast</h2>
        <div id="dailyForecast" class="daily-forecast"></div>
      </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
